# =============================================================================
# VPS runtime contract: the catalog and admin API, and nothing else.
#
# This is the compose file that runs on 91.188.212.39. The crawler does NOT run
# here: the parser and Camoufox run on the operator's workstation, and the VPS is
# used only for its proxy endpoints and its API surface. The instance here serves
# the catalog read model and the admin API; its scheduler and browser worker are
# disabled, so a missing Camoufox install can never turn into a failed crawl.
#
# It is deliberately NOT the same as ../docker-compose.yml: that one owns its own
# PostgreSQL for a self-contained local stack, while here the database lives on
# another host (91.188.212.209) and the container only needs to reach it.
#
# Kept in the repository rather than templated by the Ansible role on purpose —
# how the app runs is the app's contract, and a change to it belongs in review
# here. The role copies this file verbatim and only writes the env files next to
# it.
#
# The env files are written next to this compose file by the Caddy-vps Ansible
# role, and they are deliberately not one file:
#
#   .env         the image digest, plus the owner. Compose interpolates ${…} out
#                of this one, so anything in it is subject to `$` expansion.
#   app.env      the API credentials, passed to the container through env_file,
#                which passes values literally. A password containing `$` must
#                not be interpreted by the tooling that reads it.
#
# The image is named by its DIGEST, not by a tag. A tag can be moved: the
# `main` tag of this repository has pointed at a different image twice in one
# afternoon, and a deploy that names a tag deploys whatever the registry
# considers newest at that moment. A digest names one set of bytes, and the
# storefront that reads the catalog API is verified against exactly those bytes.
# The role resolves the tag the operator named to a digest and writes that.
#
# The digest has no `latest` fallback: a deploy that forgot to set DIGEST would
# otherwise ship whatever the registry considers newest.
# =============================================================================

services:
  wb-parser:
    image: ghcr.io/${IMAGE_OWNER:-gazon1}/wb-parser@${DIGEST:?DIGEST must be set to the image digest, e.g. DIGEST=sha256:…}
    container_name: wb-parser
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      # This instance serves data; it does not crawl. `public` disables the
      # scheduler, and the explicit switch is a second line of defence: a
      # worker started here would have no Camoufox and no persistent profiles,
      # and its first browser borrow would fail.
      SPRING_PROFILES_ACTIVE: public
      CRAWLER_WORKER_ENABLED: "false"
    # NOT published. Nothing outside the compose network has any reason to reach
    # the API; `expose` keeps it on caddy_net where Caddy and the health check
    # reach it. Binding 0.0.0.0 would put an authenticated admin API on the open
    # internet.
    expose:
      - "8080"
    networks:
      - caddy_net
    healthcheck:
      # wget, not curl: eclipse-temurin:22-jre-alpine ships no curl, so a
      # `curl -fsS …` healthcheck could never pass and the container would be
      # reported unhealthy forever. BusyBox wget exits non-zero on a 5xx and
      # zero on a 2xx, which is all this needs.
      #
      # /live, not /ready: readiness also checks the database, and a database
      # blip should not restart the API and interrupt a catalog read.
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:8080/api/health/live || exit 1"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created and owned by the Caddy-vps Ansible role. Declaring it external means
  # this compose file never creates or deletes it.
  caddy_net:
    external: true
    name: caddy_net

volumes: {}
