# =============================================================================
# Local development stack: app + postgres, no remote dependencies.
#
#   docker compose up --build    # from project root
#   just app::run-docker         # same thing via just (builds the jar first)
#
# This file deliberately contains nothing but an `include`. The stack itself lives
# in deploy/docker-compose.debug.yml, and a second copy of it here was a trap:
# the copy could never work — it built the debug image (which does NOT contain a
# jar; it expects the host-built one mounted in) without mounting one, and it
# never passed ADMIN_API_KEY, which the app refuses to start without. The two
# copies also disagreed about the database credentials, so they fought over the
# same port 5433 with different users.
#
# `include` keeps the paths in the included file resolving against *its own*
# directory (deploy/), which is what the jar mount and the build context expect.
#
# Production / VPS: deploy/docker-compose.vps.yml (app only, external DB on
# 91.188.212.209). That file is what the Ansible role deploys to the VPS.
# =============================================================================

include:
  - path: deploy/docker-compose.debug.yml
