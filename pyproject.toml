[project]
name = "wb-parser-scripts"
version = "0.1.0"
description = "Python scripts for WB catalog selection and DB loading"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "nicegui>=1.4.0",
    "playwright>=1.49.0",
    "click>=8.1.0",
    "psycopg2-binary>=2.9.9",
    "loguru>=0.7.0",
    # The operator CLI (`scripts/parser/wbparser.py`) — a terminal front end for the
    # running crawler. Typer builds the commands and Rich renders the tables, so the
    # tool is an argument list and a few queries instead of hand-rolled parsing and
    # column arithmetic.
    "typer>=0.12.0",
    "rich>=13.0.0",
    # Pydantic validates the responses the CLI reads, python-dotenv parses `.env`.
    # Both are named here rather than only in the script: the venv is the single place
    # that says what this project needs, and `uv sync` is the only setup step.
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "textual>=8.2.8",
]

# Тестовые зависимости: pytest нужен для `uv run pytest scripts/tests/...`.
# Группа `dev` ставится uv по умолчанию и не попадает в рантайм приложения.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
