[project]
name = "wb-parser-scripts"
version = "0.1.0"
description = "Python scripts for WB catalog selection and DB loading"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "nicegui>=1.4.0",
    "click>=8.1.0",
    "psycopg2-binary>=2.9.9",
    "loguru>=0.7.0",
]

# ── uv tool settings ──────────────────────────────────────────────────────────
# Allows `uv run --directory scripts/wb-catalog catalog_selector.py`
# and `uv run --directory scripts/wb-catalog load_catalog_to_pg.py ...`
[tool.uv.pip-options]
extra-index-url = ["https://pypi.org/simple/"]
