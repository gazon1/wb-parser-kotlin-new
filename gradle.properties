# Gradle settings shared by every module and by everyone who builds this repo.
#
# ## Why there is no org.gradle.java.home here
#
# It used to be pinned to /home/max/.jdks/temurin-21.0.10, which made this
# repository buildable on exactly one machine: Gradle rejects that path
# everywhere else, so a fresh clone could not compile at all — including in CI,
# where the failure reads as a mysterious "Java home supplied is invalid".
#
# The concern behind it was real at the time: Kotlin 1.9.x cannot parse the
# version string of a newer JDK, so a build running on JDK 25 failed in a way
# that looks like a Gradle bug. Pinning the path fixed that for one developer
# and broke it for everyone else. Kotlin 2.4.21 parses newer version strings,
# so the pin is no longer needed for that reason either — the path was wrong
# for the simpler reason that a path that exists on one machine cannot exist
# on another.
#
# The supported way to select the JDK is the toolchain, resolved per machine:
#
#   the version   one place — the root build's `subprojects { }` block sets
#                 `jvmToolchain(22)` for every Kotlin module
#   CI            actions/setup-java with java-version: 22
#   Docker        the builder stage runs on eclipse-temurin:22-jdk-alpine
#   local         nothing to do: the foojay resolver in settings.gradle.kts
#                 downloads a matching JDK when the machine has none
#
# If a machine really must use a specific JDK, set it in ~/.gradle/gradle.properties
# (user-level, never committed):
#
#                   org.gradle.java.home=/path/to/jdk-22
#
# CI and the image pin 22 explicitly; a local shell does not have to, because the
# toolchain provisions itself.

org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
# Gradle 8.14.6. Kotlin 2.4.21 supports Gradle 7.6.3–9.7.0, so the
# DeprecatedGradleVersionWarning suppression that this property carried until the
# upgrade is no longer needed: on 8.14.6 there is nothing to suppress.