server:
  port: 8080

spring:
  application:
    name: wb-parser

  datasource:
    # DB_NAME must match the database the migrations are applied to and the storefront
    # reads from. `wbparser` is the database created by this repo's docker-compose.yml;
    # the legacy .NET stack used `webcrawler` — pointing at the wrong one yields an
    # empty catalog with no error. Set DB_NAME explicitly everywhere it is not local.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wbparser}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # No baseline-on-migrate. Against a non-empty database it silently marks the existing
    # schema as V1 and applies nothing, leaving the .NET schema in place while the code
    # expects the Kotlin one — a divergence that only surfaces as wrong storefront data.
    # Migrating an existing database is an explicit `flyway baseline` + `flyway migrate`.
    baseline-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  security:
    user:
      # No default password: the admin API must not be reachable with a well-known
      # credential. Supply ADMIN_PASSWORD explicitly; see .env.example.
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

# OTLP
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
  service:
    name: wb-parser

# Logging
logging:
  level:
    root: INFO
    ru.wbparser: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: worker

crawler:
  schedule:
    cron: "0 0 */4 * * *"
  lock:
    timeout-minutes: 10
  worker:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: admin

crawler:
  worker:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: public

crawler:
  worker:
    enabled: false