server:
  port: 8080

spring:
  application:
    name: wb-parser

  datasource:
    # DB_NAME must match the database the migrations are applied to and the storefront
    # reads from. `wbparser` is the database created by this repo's docker-compose.yml;
    # the legacy .NET stack used `webcrawler` — pointing at the wrong one yields an
    # empty catalog with no error. Set DB_NAME explicitly everywhere it is not local.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wbparser}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # No baseline-on-migrate. Against a non-empty database it silently marks the existing
    # schema as V1 and applies nothing, leaving the .NET schema in place while the code
    # expects the Kotlin one — a divergence that only surfaces as wrong storefront data.
    # Migrating an existing database is an explicit `flyway baseline` + `flyway migrate`.
    baseline-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  security:
    user:
      # No default password: the admin API must not be reachable with a well-known
      # credential. Supply ADMIN_PASSWORD explicitly; see .env.example.
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

# OTLP
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
  service:
    name: wb-parser

# Logging
logging:
  level:
    root: INFO
    ru.wbparser: DEBUG
    org.springframework.web: INFO
    # Exposed logs every statement at DEBUG — one line per row, which drowns the log.
    # Worse: on a failed statement Exposed 0.55 expands the statement's placeholders to
    # log it, and that expansion throws NoSuchElementException, which replaces the real
    # SQLException with an unrelated error. Keep it off; raise it only when a specific
    # query needs to be inspected.
    Exposed: ${EXPOSED_SQL_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Crawler
# DB_* placeholders are shared with spring.datasource above — one pool, one database.
crawler:
  spider:
    use-browser-fetch: true
    # The egress groups: sets of AdsPower profiles that are expected to share one
    # egress IP. A group owns the request budget of its address, which is what WB
    # counts. One profile per group is the most throughput; several profiles in a
    # group buy the group a working IP while one of its profiles rests after an
    # anti-bot answer.
    #
    # This is the only list of the crawler's profiles: one list is one source of
    # truth, and a second list of the same profiles would be ignored the day the
    # two disagree.
    #
    # `direct` leaves from the address of the machine the crawler runs on — the two
    # profiles below have no proxy in AdsPower, so they share that address.
    # `socks5` leaves from the proxy configured in AdsPower for `kxpu63n`.
    egress-groups:
      - id: direct
        profiles:
          - k18a6j35
          - k17bnqsi
      - id: socks5
        profiles:
          - kxpu63n
    # The services asked for the crawler's own address, in order. The first that
    # answers wins. The probe never stops the crawler: an unreachable echo service
    # is a warning, not a failure.
    egress-probe-urls:
      - https://api.ipify.org?format=json
      - https://ifconfig.me/ip
    egress-probe-timeout-ms: 5000
    # How often the crawler asks the network which address it leaves from. The
    # address belongs to the world outside the process: a proxy may rotate it or
    # die while the crawler runs. A changed address is a new identity — the group's
    # circuit closes, its books are cleared, and the penalty the old address caused
    # is lifted from the targets it delayed.
    egress-probe-interval-ms: 900000
    # Turn "the groups turned out not to be isolated by IP" from a warning into a
    # refusal to start. On, because the groups above are separated by a proxy:
    # the crawl is entitled to the budget it was promised, and a deployment that
    # loses the proxy must not quietly keep the extra budget in its name.
    require-isolated-egress-groups: true
    browser-retry-limit: 3
    # How many crawl targets run at once. Derived from the number of profiles when
    # it is not set: the pool serialises per profile, so more workers queue rather
    # than parallelise. It used to be a number in this file that had to be kept
    # equal to the profile count by hand — and was not.
    target-concurrency: 0
    # Anti-bot session warm-up is paid once per AdsPower profile, not per page:
    # ~2 s of challenge wait on the very first request of each profile, then every
    # later request reuses the warm page.
    browser-warmup-ms: 2000
    # Per-request pacing, randomised in [min, max). Keeps request cadence off a
    # metronome so WB's rate limiting has nothing mechanical to key on.
    browser-jitter-min-ms: 200
    browser-jitter-max-ms: 500
    # An AdsPower browser nobody asked for still holds a window, a profile lock and
    # its share of the machine's memory — and it keeps its anti-bot session alive, so
    # the next run would attach to a session older than the one it could have
    # created. After this long without a request the browser is closed; the next
    # borrower reopens it, and a fresh browser means a fresh session.
    # 0 disables the closing: the browsers then live as long as the process.
    browser-idle-timeout-ms: 300000
    # How often the idle browsers are looked for. A tick, not a policy — the timeout
    # above decides what "idle" means.
    browser-janitor-interval-ms: 60000
    # Whether the browsers are stopped in AdsPower when the application exits. A
    # browser left running after the crawler is gone keeps its profile locked.
    close-browsers-on-exit: true

# ==============================================================================
# Catalog read API
# ==============================================================================
# The catalog is a second, read-only consumer of the same database. It has its own pool
# and its own role — `wb_catalog_ro`, whose rights are CONNECT, USAGE and SELECT. The
# claim "the catalog cannot write" is enforced by PostgreSQL's privileges, not by a
# session setting that code running with the same credentials could undo.
#
# CATALOG_API_KEY is required: the application does not start without it. It may hold
# several keys, separated by commas, so that a key can be rotated without a gap in
# service. It is not the admin key — the two are different consumers, and one key for
# both would turn a compromise of one into a compromise of the other.
#
# The catalog's URL points at the same database as the writer, but the credentials are
# the catalog role's own. The two are configured separately on purpose: a single
# connection string for both would put the writer's privileges within reach of the API.
catalog:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wbparser}
    username: ${CATALOG_DB_USER:wb_catalog_ro}
    password: ${CATALOG_DB_PASSWORD:}
  pool:
    # Five is the starting point, not a measured number: the budget of the database as a
    # whole (writer + catalog + everything else <= 0.7 x max_connections) is worked out
    # against the real production database, and the load test confirms or corrects it.
    max-size: 5
    min-idle: 1
    connection-timeout-ms: 3000
  api-key: ${CATALOG_API_KEY:}
  rate-limit:
    # A second line of defence behind the key: the key says who may read, this says how
    # much. Six hundred a minute is ten a second — far above what a storefront needs, far
    # below what a runaway needs to hurt. It is counted per key, so one consumer cannot
    # spend another's budget.
    enabled: ${CATALOG_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${CATALOG_RATE_LIMIT_REQUESTS_PER_MINUTE:600}
  demo-seed:
    # Off by default. The demo seed fills scraped_items with synthetic data, and the only
    # thing between that and a working database is that five independent barriers all
    # line up at once — see DemoSeedRunner.
    enabled: false
    db-user: ${CATALOG_DEMO_DB_USER:}
    db-password: ${CATALOG_DEMO_DB_PASSWORD:}
    expected-role: ${CATALOG_DEMO_EXPECTED_ROLE:}
    db-id: ${CATALOG_DEMO_DB_ID:}

---
spring:
  config:
    activate:
      on-profile: worker

crawler:
  schedule:
    # The tick: how often the scheduler looks for work.
    cron: "0 0 */4 * * *"
    # The cadence: how long a target rests after it was crawled. This is the single
    # parameter that decides how often a catalog is re-crawled.
    freshness-minutes: 240
  lock:
    timeout-minutes: 10
    # What the lock's scope is: `database` or `host`.
    #
    # `database` means one crawl at a time in the whole database — the crawler is
    # alone, and a second instance waits its turn. `host` means one crawl at a time on
    # this host: several hosts may crawl at the same time and divide the work by
    # leasing the targets. The work is divided either way; what changes is whether the
    # hosts take turns or work together.
    scope: ${CRAWLER_LOCK_SCOPE:database}
    # How long a target's lease holds, in minutes. It has to outlive the crawl of the
    # target and expire on its own: a host that dies must not hold its targets until
    # somebody notices.
    lease-minutes: ${CRAWLER_LOCK_LEASE_MINUTES:120}
  worker:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: admin

crawler:
  worker:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: public

crawler:
  worker:
    enabled: false

---
# One-shot crawl: run the crawler once, then exit.
#
# Both settings are scoped to this profile on purpose. Setting `web-application-type: none`
# in the base document would silently disable the web server for every mode, including the
# normal server run; the same goes for `worker.enabled`, which is what gates ScheduledCrawler.
spring:
  config:
    activate:
      on-profile: once
  main:
    web-application-type: none
  autoconfigure:
    exclude:
      # WebSecurityConfig is additionally profile-gated, but its auto-configured
      # counterpart still assembles a filter chain that requires a servlet context.
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

crawler:
  worker:
    enabled: false

---
# ==============================================================================
# Demo profile — synthetic data for the storefront, in a scratch database
# ==============================================================================
# The seed is guarded by five independent barriers: the flag below, the profile, the exact
# role the seeding connection resolves to, the identity marker the database carries, and
# the emptiness of the tables it is about to fill.
#
# The flag is off even here. Turning it on is a deliberate act; it is not implied by
# running under the profile. A blocking gate checks that no production template renders
# this profile or this flag.
spring:
  config:
    activate:
      on-profile: demo

crawler:
  worker:
    enabled: false

catalog:
  demo-seed:
    enabled: ${CATALOG_DEMO_SEED_ENABLED:false}
