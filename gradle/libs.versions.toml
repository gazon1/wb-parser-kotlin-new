# ==============================================================================
# The single source of truth for dependency versions.
#
# Every module reads its versions from here. That is what makes a version bump
# a one-line change, and it is what lets Dependabot open a pull request against
# one file instead of hunting for hardcoded versions in three build scripts.
#
# The version catalogue used to exist and not be used: the modules hardcoded
# their versions, and the catalogue drifted away from the build — it said
# `flyway = 10.17.0` where the build used 11.20.3, and `testcontainers = 1.20.4`
# where two modules used 1.21.3.
# ==============================================================================

[versions]
kotlin = "2.4.21"
spring-boot = "3.4.1"
# The Spring Framework jars the application names. Spring Boot 3.4.1 manages
# Spring Framework 6.2.1, so this is the version the BOM would pick anyway —
# written down here because the dependency-analysis plugin asks for these
# artifacts to be declared directly.
spring = "6.2.1"
spring-security = "6.4.2"
tomcat-embed = "10.1.34"
ktor = "2.3.13"
exposed = "0.55.0"
flyway = "11.20.3"
kotest = "6.2.4"
arrow = "2.2.3"
mockk = "1.14.11"
testcontainers = "1.21.3"
junit = "5.13.4"
resilience4j = "2.2.0"
coroutines = "1.10.2"
serialization = "1.7.3"
detekt = "1.23.7"
ktlint-plugin = "12.1.1"
# The ktlint CLI version is independent of the Gradle plugin version above.
ktlint = "1.3.0"
kover = "0.9.11"
logback = "1.5.14"
kotlin-logging = "3.0.5"
slf4j = "2.0.17"
# Jackson's artifacts do not share one version line. From 2.20 on,
# jackson-annotations is published as "2.20", "2.21", "2.22" — a line, without
# a patch — while jackson-databind and jackson-core are published as "2.22.0"
# … "2.22.4". One version key for both would let a version that exists for one
# of them travel to the other, and the build would ask Maven Central for a
# release nobody published. The keys are apart, and so are the versions.
jackson = "2.22.4"
jackson-annotations = "2.22"
micrometer = "1.15.0"
postgresql = "42.7.4"
hikaricp = "5.1.0"
playwright = "1.49.0"
sqlite = "3.46.0.0"
# SnakeYAML parses the OpenAPI contract document the API serves.
snakeyaml = "2.3"
# The servlet API the Spring MVC test doubles extend.
jakarta-servlet = "6.0.0"
# Hamcrest matchers: the way MockMvc asserts on a response body without the test
# reaching for the servlet API.
hamcrest = "2.2"

[libraries]
# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlin-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-coroutines-reactor = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-reactor", version.ref = "coroutines" }
kotlin-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }
kotlin-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Spring Boot
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator", version.ref = "spring-boot" }
spring-boot-starter-security = { group = "org.springframework.boot", name = "spring-boot-starter-security", version.ref = "spring-boot" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-starter-aop = { group = "org.springframework.boot", name = "spring-boot-starter-aop", version.ref = "spring-boot" }
spring-boot-starter-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-jdbc", version.ref = "spring-boot" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test", version.ref = "spring-boot" }
spring-boot = { group = "org.springframework.boot", name = "spring-boot", version.ref = "spring-boot" }
spring-boot-autoconfigure = { group = "org.springframework.boot", name = "spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-test = { group = "org.springframework.boot", name = "spring-boot-test", version.ref = "spring-boot" }
spring-boot-test-autoconfigure = { group = "org.springframework.boot", name = "spring-boot-test-autoconfigure", version.ref = "spring-boot" }
spring-web = { group = "org.springframework", name = "spring-web", version.ref = "spring" }
spring-webmvc = { group = "org.springframework", name = "spring-webmvc", version.ref = "spring" }
spring-core = { group = "org.springframework", name = "spring-core", version.ref = "spring" }
spring-context = { group = "org.springframework", name = "spring-context", version.ref = "spring" }
spring-beans = { group = "org.springframework", name = "spring-beans", version.ref = "spring" }
spring-test = { group = "org.springframework", name = "spring-test", version.ref = "spring" }
spring-security-core = { group = "org.springframework.security", name = "spring-security-core", version.ref = "spring-security" }
spring-security-config = { group = "org.springframework.security", name = "spring-security-config", version.ref = "spring-security" }
spring-security-web = { group = "org.springframework.security", name = "spring-security-web", version.ref = "spring-security" }
tomcat-embed-core = { group = "org.apache.tomcat.embed", name = "tomcat-embed-core", version.ref = "tomcat-embed" }

# Ktor Client
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-http = { group = "io.ktor", name = "ktor-http", version.ref = "ktor" }
ktor-serialization = { group = "io.ktor", name = "ktor-serialization", version.ref = "ktor" }

# Exposed
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-dao = { group = "org.jetbrains.exposed", name = "exposed-dao", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-json = { group = "org.jetbrains.exposed", name = "exposed-json", version.ref = "exposed" }
exposed-java-time = { group = "org.jetbrains.exposed", name = "exposed-java-time", version.ref = "exposed" }

# Database
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikaricp" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }
jakarta-servlet = { group = "jakarta.servlet", name = "jakarta.servlet-api", version.ref = "jakarta-servlet" }
hamcrest = { group = "org.hamcrest", name = "hamcrest", version.ref = "hamcrest" }

# Resilience
resilience4j-kotlin = { group = "io.github.resilience4j", name = "resilience4j-kotlin", version.ref = "resilience4j" }
resilience4j-core = { group = "io.github.resilience4j", name = "resilience4j-core", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { group = "io.github.resilience4j", name = "resilience4j-circuitbreaker", version.ref = "resilience4j" }

# Arrow
arrow-core = { group = "io.arrow-kt", name = "arrow-core", version.ref = "arrow" }
arrow-exception-utils = { group = "io.arrow-kt", name = "arrow-exception-utils", version.ref = "arrow" }

# Browser automation (Playwright — requires native binaries)
playwright = { group = "com.microsoft.playwright", name = "playwright", version.ref = "playwright" }

# Logging
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
kotlin-logging = { group = "io.github.microutils", name = "kotlin-logging", version.ref = "kotlin-logging" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

# JSON
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations", version.ref = "jackson-annotations" }
jackson-datatype-jsr310 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jsr310", version.ref = "jackson" }

# Metrics
micrometer-core = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }

# Testing
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
# The JUnit API is used directly by the suites. It used to arrive only transitively,
# through kotest's BOM — the dependency-analysis plugin reported it as "should be
# declared directly", which is true: the module names these types in its own sources.
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
testcontainers = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }
