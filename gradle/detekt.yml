build:
  maxIssues: 0
  excludeCorrectable: true

config:
  validation: true

style:
  active: true
  MagicNumber:
    active: false
  # `check`/`require` say what the code expects; a bare `throw IllegalStateException`
  # says only that something was wrong.
  UseCheckOrError:
    active: true
  ReturnCount:
    active: true
    max: 4
  UnusedPrivateMember:
    active: true
    excludes: ['**/test/**']

complexity:
  active: true
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 6
    # Test builders legitimately take one argument per pipeline stage.
    excludes: ['**/test/**']
  # TooManyFunctions lives under `complexity`, not `style`. The detailed thresholds
  # below were previously written under `style`, where detekt silently ignored them.
  TooManyFunctions:
    active: true
    excludes: ['**/test/**']
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 10
    thresholdInObjects: 10
    thresholdInEnums: 10

naming:
  active: true
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
  # detekt 1.23 split the old `PropertyNaming` rule into VariableNaming /
  # TopLevelPropertyNaming / ObjectPropertyNaming.
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'

potential-bugs:
  active: true
  NullCheckOnMutableProperty:
    active: false

exceptions:
  active: true
  # A caught exception that is never used is an error nobody can see. The
  # repository's own rule says so — the error must reach a StageFailure or a log —
  # and the rule was only ever prose until now.
  SwallowedException:
    active: true
  # A `throw RuntimeException(...)` tells the reader nothing about what to catch.
  TooGenericExceptionThrown:
    active: true