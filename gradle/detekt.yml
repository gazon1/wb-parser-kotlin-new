build:
  maxIssues: 0
  excludeCorrectable: true

config:
  validation: true
  defaultActiveProfile: default

style:
  active: true
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 4
  TooManyFunctions:
    active: true
    excludes: ['**/test/**']
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 10
    thresholdInObjects: 10
    thresholdInEnums: 10
  UnusedPrivateMember:
    active: true
    excludes: ['**/test/**']

complexity:
  active: true
  LongParameterList:
    active: true
    threshold: 6
  TooManyFunctions:
    active: true
    thresholdInFiles: 30

naming:
  active: true
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
  PropertyNaming:
    active: true
    propertyPattern: '[a-z][a-zA-Z0-9]*'

potential-bugs:
  active: true
  NullCheckOnMutableProperty:
    active: false

exceptions:
  active: true
  SwallowedException:
    active: false
