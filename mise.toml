[tools]
# `uv` runs the pinned `datamodel-code-generator` that produces
# `scripts/parser/catalog_models.py`. The CI `static` job regenerates the file and
# fails on a diff, so the tool that does it is pinned here like every other tool.
uv = "0.13.8"
hadolint = "2.15.1"
typos = "1.52.0"
hk = "2.11.1"
jactionlint = "2.4.0"
lychee = "0.24.2"
osv-scanner = "2.7.0"
ruff = "0.17.3"
rumdl = "0.3.2"
shellcheck = "0.11.0"
vacuum = "0.36.2"
betterleaks = "1.9.0"
ast-grep = "0.51.1"

# agnix publishes per-platform archives and mise's http backend has no platform
# conditional, so the pin names the asset this repository's CI and dev machines
# use (Linux x86_64). macOS/ARM would need a matching URL.
[tools."http:agnix"]
version = "0.61.0"
url = "https://github.com/agent-sh/agnix/releases/download/v{{ version }}/agnix-x86_64-unknown-linux-gnu.tar.gz"

[tasks.check]
description = "Run all verification gates (same as ./check.sh)"
run = "./check.sh"
