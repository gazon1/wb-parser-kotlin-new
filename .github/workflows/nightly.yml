name: CI (nightly)

# The nightly run: the same pipeline as a pull request, on a schedule.
#
# The pipeline itself lives in ci.yml and is *called* from here. One
# definition, two entry points — the same arrangement the repository already
# uses for the gates (one registry, two callers) and for the lint corrector
# (one script, two callers). A schedule that is one more trigger inside the
# pipeline's own file is a schedule that is invisible as an entry point: the
# question "what runs overnight, and who reads it" has no answer in the tree.
#
# The difference between this and a pull request is one input: the pipeline
# opens a GitHub issue when it fails, because nobody is watching at 03:00
# and a red badge that only the next push clears is not a report.
on:
  schedule:
    # Nightly, 03:00 UTC. The whole pipeline runs on its own: a repository
    # whose tests only run when somebody pushes is a repository whose tests
    # are never run — the failures that only a week of drift produces (a
    # dependency that moved, a migration that stopped applying) are exactly
    # the ones nobody hits on purpose.
    #
    # GitHub disables scheduled workflows in a repository with no activity for
    # 60 days, and it delays scheduled runs that land in a busy hour. The
    # failure of this run is reported as an issue by the pipeline's
    # `nightly-alert` job, so a delayed run is visible rather than silent.
    - cron: "0 3 * * *"
  workflow_dispatch:
    # The same pipeline, started by hand — for a repository that wants to
    # check the state of the world before a release, or right after a
    # dependency bump that has been sitting unverified.

# The top level declares what a job gets unless it says otherwise. The one
# job below declares its own — the grant of the pipeline, which is wider than
# this workflow's own needs — so this is the floor.
#
# It also ends the "no topLevel permission defined" finding the Scorecard
# reports: a workflow that says nothing about permissions leaves the grant to
# the repository's default, which is a decision nobody made.
permissions:
  contents: read

jobs:
  nightly:
    # The permissions of the caller are the ceiling for every job of the
    # called pipeline, and GitHub checks that ceiling *statically*: it
    # rejects the call when a nested job asks for more than the caller
    # grants, whether that job would have run or not. The first version of
    # this wrapper granted only what the nightly itself needs, and the
    # pipeline was rejected at startup because the image job asks for
    # `packages: write` — a job the nightly never runs.
    #
    # So the grant is the pipeline's whole ceiling, and the narrowing
    # happens inside: every job of the pipeline declares the permissions it
    # needs, so the registry write reaches the image job and nothing else.
    # The image job does not run on a schedule.
    permissions:
      actions: read
      contents: read
      issues: write
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      # The one difference between the two entry points.
      alert_on_failure: true
