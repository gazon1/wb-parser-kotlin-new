name: Scorecard

# OpenSSF Scorecard: the security posture of the repository itself, measured
# by twenty checks that read the repository the way an attacker would — is
# there a branch protection, are the actions pinned, is there a security
# policy, does the CI run on every pull request.
#
# The score is not a gate. It is a number that moves, and a number that moves
# without anyone noticing is the same as no number. It is published to the
# Scorecard API, where the badge and the per-check breakdown live, and the
# SARIF file is uploaded to code scanning so the findings sit next to the
# CodeQL alerts.
#
# `id-token: write` is required by scorecard-action v2 to publish the
# results: the publication is authenticated with an OIDC token that proves
# this run is the run that produced the file. Without it the action refuses
# to publish, which is a check that says "your results are not trustworthy"
# — the opposite of what this workflow is for.
#
# See docs/decisions/2026-10-20-ci-security-gates-and-lint-autofix.md.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:23 UTC — after the CodeQL run, so the two do not
    # compete for the same runners at the same time.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Publishing to the Scorecard API is authenticated with OIDC.
      id-token: write
      # The SARIF results are uploaded to code scanning.
      security-events: write
      # Scorecard reads the workflow files of the repository.
      actions: read
      contents: read

    steps:
      # `persist-credentials: false`: the checkout's token is not left in the
      # git configuration, where the next step could pick it up. This workflow
      # pushes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run the analysis
        id: scorecard
        # Pinned to the commit, not to a tag: there is no `v2` tag in
        # ossf/scorecard-action — the published tags stop at v2.5.0 — so
        # `ossf/scorecard-action@v2` does not resolve and the workflow fails
        # before it starts. v2.5.0 is the release whose image lives on
        # ghcr.io; the README asks for "v2.6.0 or later" because the tag has
        # moved on, and the action's own `action.yaml` still points at the
        # v2.5.0 image.
        uses: ossf/scorecard-action@46dc3187a971a9febf3aeb7f94ccde489f7bb46a # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # A publication the API rejected is a report nobody will read, and
          # a report that nobody reads is the same as no report.
          fail_on_publish_error: true

      # `if: always()` on both: the results file is written before the
      # publication is attempted, so it exists even when the publication
      # failed — and a run whose publication failed is exactly the run whose
      # file somebody needs to read.
      - name: Upload the results as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload the results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
          category: scorecard
