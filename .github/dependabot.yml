# Dependency updates.
#
# The dependency-analysis plugin tells us whether a dependency is *used*; it
# cannot tell us whether the version is current — there is no outdated-dependency
# task in it. This file covers that half, and it does it the same way the
# repository handles everything else: it opens a pull request, and the gates
# decide whether the change is good.
#
# The Gradle ecosystem reads both the build files and gradle/libs.versions.toml,
# so a version bump arrives as a one-line change in the catalogue and is
# reviewed like any other change.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Patch and minor updates travel together, separately from the majors.
      #
      # A patch or a minor cannot change the meaning of the code — the gates
      # decide whether the build still works, and that is the whole decision.
      # A major can: ktor 3 moves packages, junit 6 changes the test API. So
      # the majors are grouped by dependency (each one needs its own reading)
      # and everything else travels in one pull request that a machine may
      # merge once the gates are green.
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
        # Jackson travels apart. Its artifacts do not share one version line:
        # from 2.20 on, jackson-annotations is published as "2.20", "2.21",
        # "2.22" — a line, without a patch — while jackson-databind and
        # jackson-core are published as "2.22.0" … "2.22.4". One version key
        # for both of them let a version that exists for one artifact travel
        # to the other, and the build asked Maven Central for a release
        # nobody published.
        #
        # The catalogue keeps the versions apart (see gradle/libs.versions.toml),
        # and the pull requests keep apart too: a bump that changes the
        # version *line* is a decision for a person, and one such decision
        # must not hold the other thirty-five updates hostage.
        exclude-patterns:
          - "com.fasterxml.jackson*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
        update-types:
          - "patch"
          - "minor"
      # Kotlin moves the compiler and the standard library together; splitting
      # them across pull requests produces a build that cannot be tested.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
        update-types:
          - "major"
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - "major"
      test:
        patterns:
          - "io.kotest*"
          - "io.mockk*"
          - "org.testcontainers*"
        update-types:
          - "major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      # The actions are independent of each other, so a patch to one of them
      # cannot break another — and one pull request is one thing to read.
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  # The base images of Dockerfile.app and Dockerfile.debug. The JDK inside them is
  # pinned to the version the build asks for, so a bump of the base image is a
  # pull request to review — not a surprise on the next build. The pin is checked
  # by `scripts/ci/check-docker-jdk.py`: a bump that moves the JDK without moving
  # the toolchain fails the static gates, before the merge.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
