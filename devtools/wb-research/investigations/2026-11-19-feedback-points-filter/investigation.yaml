id: 2026-11-19-feedback-points-filter
title: The points for a review live in feedbackPoints, and WB filters them with ffeedbackpoints
scenario: wb-feedback-points
site: www.wildberries.ru
status: concluded
created: 2026-11-19T18:00:00+03:00
updated: 2026-11-19T20:30:00+03:00
raw_captures: ~/.cache/wb-research/2026-11-19-feedback-points-filter/
tools:
  - name: chrome-use
    version: 1.5.294

steps:
  - action: fetch the catalog endpoint for `menu_v3_9467 карты памяти` without any filter
    expected: the catalog, and the products that carry points among them
    observed: >-
      200, total 50241, 100 products — and only 2 of them carried a `feedbackPoints` field
      (both 250). Every product carried a wallet cashback of 0
    evidence: [probe-points-filter-no-filter]
  - action: fetch the same catalog with `ffeedbackpoints=1`
    expected: the products that pay WB points for a review
    observed: >-
      200, total 19, 19 products — and all 19 carried points, 80..450. Every product still
      carried a wallet cashback of 0
    evidence: [probe-points-filter-ffeedbackpoints-1]
  - action: fetch the same catalog with `fcashback=1` instead
    expected: the products with a wallet cashback
    observed: >-
      200, total 15, 15 products — all 15 with a wallet cashback of 1 %..3 %, and none of
      them with points
    evidence: [probe-cashback-filter-fcashback-1]
  - action: measure the cashback of the same `fcashback=1` products next to their prices
    expected: the unit of `price.cashback` — an amount in kopecks or a percentage
    observed: >-
      cashback 1..3 against prices of 850..10000 ₽ (85000..1000000 kopecks). An amount in
      kopecks would be 0.01..0.03 ₽ on those prices, which no storefront shows; a
      percentage is 1 %..3 % of the price paid, which is what the storefront shows
    evidence: [probe-cashback-pairs-fcashback-1]

