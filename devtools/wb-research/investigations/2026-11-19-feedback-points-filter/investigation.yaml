evidence:
  - id: feedback-points-filter
    fixture: evidence/feedback-points-filter.json
    kind: probe
    note: >-
      the same catalog query in three variants — no filter, `ffeedbackpoints=1` and
      `fcashback=1` — with the counts each of them measured
    captures:
      - probe-points-filter-no-filter
      - probe-points-filter-ffeedbackpoints-1
      - probe-cashback-filter-fcashback-1
      - probe-cashback-pairs-fcashback-1

validation:
  - claim: WB sends the points it pays for a review in the product object, as `feedbackPoints`
    state: reproduced
    rationale: >-
      two independent runs of the same catalog query found the field — 2 products of 100
      without a filter, and all 19 products with `ffeedbackpoints=1`. The storefront's own
      bundle reads the same name and renders it as "N Б ЗА ОТЗЫВ"
    evidence: [probe-points-filter-no-filter, probe-points-filter-ffeedbackpoints-1]
  - claim: `ffeedbackpoints=1` narrows the answer to the products that carry points
    state: reproduced
    rationale: >-
      the same catalog answered 50241 products without the filter and 19 with it, and all
      19 carried points (80..450). A second run on the same day answered 50246 and 19 —
      the catalog moves, the ratio does not
    evidence: [probe-points-filter-no-filter, probe-points-filter-ffeedbackpoints-1]
  - claim: the wallet cashback filter selects a different set of goods than the points filter
    state: reproduced
    rationale: >-
      `fcashback=1` answered 15 products, all with a wallet cashback of 1 %..3 % and none
      with points; `ffeedbackpoints=1` answered 19 products, all with points and all with a
      wallet cashback of 0. The two sets do not overlap in this catalog
    evidence: [probe-points-filter-ffeedbackpoints-1, probe-cashback-filter-fcashback-1]
  - claim: `price.cashback` is a percentage, not an amount in kopecks
    state: reproduced
    rationale: >-
      the same `fcashback=1` products measured with their prices: cashback 1..3 against
      prices of 85000..1000000 kopecks. Read as an amount it would be 0.01..0.03 ₽, which
      the storefront never shows; read as a percentage it is 1 %..3 % of the price paid
    evidence: [probe-cashback-pairs-fcashback-1]
  - claim: `ffeedbackpoints` is WB's own filter for «Баллы ВБ за отзыв»
    state: observed
    rationale: >-
      the `resultset=filters` answer of a text search lists it under that name with a
      single item «Да». The filters answer of a menu-token catalog does not list it, and
      the parameter works there all the same
    evidence: [probe-points-filter-ffeedbackpoints-1]

open_questions:
  - whether the filter behaves the same in every catalog — only `menu_v3_9467` was measured
  - >-
    whether the points a product pays change over time, and whether a crawl should keep
    the history of them the way it keeps the history of prices

