validation:
  - claim: the storefront reads the catalog with GET /__internal/u-search/exactmatch/ru/common/v18/search and resultset=catalog
    state: reproduced
    rationale: the request is in the page load and again in the scroll, with the same endpoint and the same query
    evidence: [initial-load-003, next-page-007]
  - claim: the catalog answer is a JSON object with metadata, products and total, even though the content type says text/plain
    state: observed
    rationale: >-
      the body of the request was read and its top-level keys are metadata, products and total. The
      earlier investigation could not say this — it saw the byte count and never the content
    evidence: [initial-load-003, next-page-007]
  - claim: loading more products asks the card list endpoint, not the search endpoint
    state: observed
    rationale: three requests to /__internal/u-card/cards/v4/list carry a products array, while the search request of the same step is the refresh of the search
    evidence: [next-page-003, next-page-005, next-page-006]
  - claim: the traffic of a WB page is dominated by hosts that carry no API
    state: reproduced
    rationale: >-
      of the 312 recorded requests of the page load, 8 are kept as evidence and the fixture counts the
      other 304: 280 noise-host (the static basket and the analytics hosts), 18 other-host and 6
      type-not-kept (the approved hosts, with traffic that is not an API call) — none of them is an
      API call. The hosts behind the counts are in the report of the capture, in the raw cache, which
      is not committed
    evidence: [initial-load]
  - claim: the capture knows which requests are Wildberries API calls
    state: open
    rationale: >-
      the filter keeps the requests of the approved hosts and fails loudly on an API call to a
      host that is neither approved nor marked as noise, but the approved list is a human
      decision and no one has checked it against the whole site
    evidence: [initial-load-003, next-page-002]

open_questions:
  - whether the products of the card list and the products of the search answer are the same list
  - what the search-goods array carries, and who reads it
  - whether the antibot analytics calls matter for a crawler that is not a browser

