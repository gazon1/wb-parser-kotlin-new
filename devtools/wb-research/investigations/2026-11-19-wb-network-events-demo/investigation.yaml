id: 2026-11-19-wb-network-events-demo
title: The catalog page load and the next page, captured and correlated
scenario: wb-network-events
site: www.wildberries.ru
status: concluded
created: 2026-11-19T20:06:00+03:00
updated: 2026-11-19T20:40:00+03:00
raw_captures: ~/.cache/wb-research/2026-11-19-wb-network-events-demo/
tools:
  - name: chrome-use
    version: 1.5.294
  - name: scripts/wb-research/capture.py
    version: local capture script, unpinned (issue 310)

steps:
  - action: open the catalog page for 131954 in a real Chrome session and record the network
    expected: the storefront issues a catalog search request and the traffic around it
    observed: >-
      eight requests on the approved hosts, among them two searches against
      /__internal/u-search/exactmatch/ru/common/v18/search — one for the catalog, one for the
      filters. The catalog answer is served as text/plain and its body is a JSON object with
      metadata, products and total
    evidence: [initial-load-003, initial-load-005]
  - action: scroll the same page to the bottom and record the network again
    expected: the page asks for more products
    observed: >-
      nine requests on the approved hosts, among them three card lists against
      /__internal/u-card/cards/v4/list and another catalog search. The analytics host
      search-goods.wildberries.ru answered the query as a JSON array
    evidence: [next-page-003, next-page-005, next-page-007]

