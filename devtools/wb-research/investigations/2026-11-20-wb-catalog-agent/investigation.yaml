validation:
  - claim: the storefront reads the seller catalog with GET /__internal/u-search/exactmatch/ru/common/v18/search and resultset=catalog
    state: reproduced
    rationale: >-
      the request is in the page load and again in the scroll, with the same endpoint and the same
      query; the second one adds page=2
    evidence: [initial-load-004, next-page-008]
  - claim: the catalog answer is a JSON object with metadata, products and total, even though the content type says text/plain
    state: reproduced
    rationale: >-
      the body of the request was read in two steps and the top-level keys are the same three
    evidence: [initial-load-004, next-page-008]
  - claim: the next page of the catalog is the same endpoint with the parameter page
    state: observed
    rationale: >-
      the search request of the scroll carries page=2 and no other value of the parameter was seen;
      the run was one, so the claim is not reproduced yet
    evidence: [next-page-008]
  - claim: loading more products asks the card list endpoint with the ids of the products to render, in the parameter nm
    state: observed
    rationale: >-
      three requests to /__internal/u-card/cards/v4/list of the scroll carry a list of product ids in
      nm, and the answers carry a products array
    evidence: [next-page-004, next-page-005, next-page-006]
  - claim: the sort order of the page URL is carried by the catalog search request
    state: rejected
    rationale: >-
      the page was opened with sort=rating and the redirect check of the page carried it, but the
      catalog search request asked for sort=popular. The parameter of the page URL does not reach
      the request, so the sort of the storefront is something else — the control of the page, most
      likely, and a click is out of the read-only scope of the capture
    evidence: [sort-by-rating-002, sort-by-rating-003, initial-load-004]
  - claim: the catalog request carries deviceid, x-requested-with, x-spa-version, x-queryid and x-userid
    state: reproduced
    rationale: the same five headers are on the request of the page load and of the scroll
    evidence: [initial-load-004, next-page-008]
  - claim: the catalog request carries the browser session without a cookie of its own
    state: open
    rationale: >-
      the capture keeps the names of the headers, not their values, and a header of the browser is
      not in the request at all: whether the session rides on the cookie of the browser or on the
      deviceid is not settled here
    evidence: [initial-load-004]
  - claim: every page of the storefront calls the antibot service
    state: observed
    rationale: >-
      the page load asks for the settings of the frontend and the scroll posts the analytics of the
      page four times
    evidence: [initial-load-001, next-page-001, next-page-002, next-page-007, next-page-009]

open_questions:
  - how the sort order of the storefront is changed at all, given that the parameter of the URL is ignored
  - whether the products of the card list and the products of the search answer are the same list
  - what splitter.wb.ru/v2/result answers, and why the page needs it — it answers 204 with no body
  - whether the crawler sends the sort order the storefront sends, and which of the two is the source of truth

follow_up:
  kotlin_adapter: not-started
  issue: 311
  pr: null
  note: >-
    the record is about the site, not about the crawler. The finding that reaches the crawler is the
    sort: the storefront does not take it from the URL, so the crawler cannot copy the sort of the
    page by adding a parameter to its URL. The endpoint, the parameters and the shape of the answer
    are the ones the crawler already knows (issue 308); the page=2 of the next page and the nm of the
    card list are new to this record and are not in the crawler yet. Two things were widened for this
    run and are named here: the shared capture config names the query parameter sort, which the sort
    step needed to open the page, and the origin splitter.wb.ru was approved for this investigation
    alone, in the plan of the step that reached it.
