id: 2026-11-20-wb-catalog-agent
title: The seller catalog is loaded by one search endpoint, paged by the same endpoint, and the sort of the page URL is ignored
scenario: wb-catalog-request
site: www.wildberries.ru
status: concluded
created: 2026-11-20T18:05:00+03:00
updated: 2026-11-20T19:20:00+03:00
tools:
  - name: chrome-use
    version: 1.5.295
  - name: scripts/wb-research/plan.py
    version: local plan runner, unpinned (issue 311)
  - name: scripts/wb-research/capture.py
    version: local capture script, unpinned (issue 310)

steps:
  - action: open the catalog page for 131954 with the search token, in a real Chrome session, and record the network
    expected: the storefront issues a catalog search request and the traffic around it
    observed: >-
      ten requests on the approved hosts, among them one catalog search against
      /__internal/u-search/exactmatch/ru/common/v18/search with resultset=catalog, a second search with
      resultset=filters, the redirect check of the page and the analytics of the antibot service. The
      catalog answer is served as text/plain and its body is a JSON object with metadata, products and
      total. The call to splitter.wb.ru was to an origin the config did not approve, so the step stopped
      and waited for the operator; the operator approved that origin for this investigation alone
    evidence: [initial-load-003, initial-load-004, initial-load-007]
  - action: open the same catalog page with the sort order of the URL (sort=rating) and record the network
    expected: the sort order of the page URL is carried by the catalog search request
    observed: >-
      the redirect check of the page carried sort=rating, so the site read the parameter of the URL, but
      the catalog search request still asked for sort=popular. The parameter of the page URL does not
      reach the request
    evidence: [sort-by-rating-002, sort-by-rating-003]
  - action: scroll the page to the bottom twice, in the same session, and record the network
    expected: the page asks for more products of the same catalog
    observed: >-
      nine requests on the approved hosts: three card lists against /__internal/u-card/cards/v4/list,
      each of them carrying the ids of the products to render in the parameter nm, and a second catalog
      search — the same endpoint as the first step, with page=2
    evidence: [next-page-004, next-page-005, next-page-006, next-page-008]

