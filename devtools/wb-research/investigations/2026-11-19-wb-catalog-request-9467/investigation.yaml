    version: local site adapter, unpinned (issue 308)

steps:
  - action: open the catalog page for 9467 in a real Chrome session and record the network
    expected: the storefront issues a catalog search request
    observed: >-
      the document itself answered 498, WB's anti-bot answer, but the page still issued two
      requests to the search endpoint — the catalog one and the filters one — and both
      answered 200
    evidence: [wb-catalog-9467-150, wb-catalog-9467-209]
  - action: fetch the same endpoint from page JavaScript, credentials included, with only x-requested-with and x-userid
    expected: the same answer the storefront gets
    observed: 403 with a zero-length body
    evidence: [attempt-00-baseline, wb-catalog-9467-262]
  - action: repeat with x-spa-version added
    expected: 200 if the storefront's version header is what the endpoint checks
    observed: 403 with a zero-length body, so the version header alone is not enough
    evidence: [attempt-02-spa-version]
  - action: repeat with deviceid added
    expected: 200 if the profile identifier is what the endpoint checks
    observed: 200, 133632 bytes
    evidence: [attempt-01-deviceid]
  - action: repeat the deviceid-only request twice more
    expected: the same answer, so the result is not a one-off
    observed: 200, 133632 bytes both times
    evidence: [attempt-04-deviceid-repeat-1, attempt-05-deviceid-repeat-2]
  - action: repeat with the crawler's own header values — deviceid site_a39361daf4ec45f2a68c5c6ca73c8adf and x-spa-version 14.28.3
    expected: 200, because the crawler sends exactly these
    observed: 200, 133632 bytes
    evidence: [attempt-06-crawler-header-values]
  - action: probe the endpoint from page JavaScript with the browser's own deviceid, once with the storefront's URL and once with the crawler's URL
    expected: the catalog — a product list
    observed: >-
      200 with a 233-byte JSON envelope — name, query, normQuery, shardKey, filters, rs, rmi,
      search_result — and no products under any name
    evidence: [probe-page-fetch-storefront, probe-page-fetch-withPage]

