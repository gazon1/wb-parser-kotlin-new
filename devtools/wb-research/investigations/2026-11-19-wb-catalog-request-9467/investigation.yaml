validation:
  - claim: the storefront reads a catalog through GET /__internal/u-search/exactmatch/ru/common/v18/search with resultset=catalog
    state: observed
    rationale: one capture of the storefront's own request; the filters request uses the same endpoint with resultset=filters
    evidence: [wb-catalog-9467-150, wb-catalog-9467-209]
  - claim: the storefront's catalog request carries deviceid, x-queryid, x-requested-with, x-spa-version and x-userid, and carries no x-clientinfo and no type
    state: observed
    rationale: the recorded request headers of the storefront's own request
    evidence: [wb-catalog-9467-150]
  - claim: a request to the endpoint without a deviceid is answered with 403 and a zero-length body
    state: reproduced
    rationale: three independent attempts without deviceid — the baseline, the x-spa-version-only attempt and the recorded HAR request — all answered 403 with no body
    evidence: [attempt-00-baseline, attempt-02-spa-version, wb-catalog-9467-262]
  - claim: adding deviceid changes the answer from 403 to 200, and x-spa-version alone does not
    state: reproduced
    rationale: >-
      deviceid alone answered 200 and repeated twice; x-spa-version alone answered 403. This is a
      claim about the status, not about the body — the next claim is the one the same evidence
      does not settle
    evidence: [attempt-01-deviceid, attempt-02-spa-version, attempt-03-deviceid-and-spa, attempt-04-deviceid-repeat-1, attempt-05-deviceid-repeat-2]
  - claim: a 200 from a page-JavaScript fetch carries the catalog
    state: open
    rationale: >-
      in this session it did not. The adapter's 200 answered 133632 bytes that are not JSON, and
      the later probes answered a 233-byte JSON envelope with no products, while the storefront's
      own request answered 44265 bytes whose content was never captured. The status is not the
      question, and the evidence does not answer it
    evidence: [attempt-01-deviceid, probe-page-fetch-storefront, probe-page-fetch-withPage, wb-catalog-9467-150]
  - claim: WB answers a menu-token query with a search_result envelope rather than a product list
    state: observed
    rationale: >-
      both probes answered 200 with the same 233-byte envelope — name, query, normQuery, shardKey,
      filters, rs, rmi, search_result — and no products under any name
    evidence: [probe-page-fetch-storefront, probe-page-fetch-withPage]
  - claim: the deviceid value the crawler is configured with is not rejected by the endpoint
    state: validated
    rationale: >-
      the value in WbCatalogApi.buildWbHeaders() was sent verbatim and answered 200 with the same
      133632 bytes as the browser's own deviceid
    evidence: [attempt-06-crawler-header-values]
  - claim: the crawler's header constants describe what the storefront sends
    state: rejected
    rationale: >-
      the storefront sends no x-clientinfo and no type, its user agent is Chrome 155 where the
      crawler claims 143, its x-spa-version is 14.33.1 where the crawler claims 14.28.3, and its
      referer is the catalog page URL where the crawler sends /catalog/<id>/list.aspx
    evidence: [wb-catalog-9467-150]

open_questions:
  - why the catalog document answered 498 while the page's own catalog request answered 200 from the same session
  - why the storefront's request answered 44265 bytes and a page-JavaScript fetch answered a 233-byte envelope
  - >-
    what the search_result envelope asks the client to do — the crawler's parser looks for
    products under data, payload and the top level, and would report this answer as a changed
    answer shape
  - whether the endpoint accepts any deviceid value or only the one bound to the browser profile

follow_up:
  kotlin_adapter: not-needed
  issue: 308
  pr: null
  note: >-
    the crawler already sends a deviceid that the endpoint does not reject, so the request itself
    needs no adapter change; the stale header constants and the referer shape are tracked in
    issue 308, and the search_result envelope is worth watching — an answer in that shape would
    fail the crawler's parser as a changed answer shape
